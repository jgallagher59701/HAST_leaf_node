;;; PlatformIO Project Configuration File
;;;
;;;   Build options: build flags, source filter
;;;   Upload options: custom upload port, speed and extra flags
;;;   Library options: dependencies, extra library storages
;;;   Advanced options: extra scripting
;;;
;;; Please visit documentation for the other options and examples
;;; https://docs.platformio.org/page/projectconf.html
;;;
;v The RocketScream has an SWD connector. For debugger info, 
;;; see https://docs.platformio.org/en/latest/plus/debug-tools/jlink.html

;;; The code only supports the M0-based RocketScream

[platformio]
default_envs = zeroUSB
;zeroUSB, debugZeroUSB

;; You MUST inject these options into [env:] section
;; using ${common_env_data.***} (see below)
;; NB: For FREQUENCY: Channel 0 is 902.3, others are + 200KHz for BW = 125 KHz. 
;; There are 64 channels. 915.0 MHz is the no-channel nominal freq
;; For the NODE_ADDRESS, until a configuration mode/program is made, this must be
;; set as a compile-time constant. Values < 3 indicate hand-built nodes that 
;; have different pin assignments than the PCB nodes. I started using 10++ for
;; the version 0.5 PCB.
[common_env_data]
build_flags =
    -D VERSION=1.2
    -D STANDBY_MODE=1   ; Use standby (sleep) mode for power saving
    -D SERIAL_DIAG=0
    -D DEBUG_LOG=0
    -D LORA_ERROR_REPORT=1  ; Requires a main node that can handle them
    -D NODE_ADDRESS=5
    -D FREQUENCY=902.3
    -D TIME_REQUEST_SAMPLE_PERIOD=3
    -D STANDBY_INTERVAL_S=59    ;only used when STANDBY_MODE=0, delay/yield seconds
    ;; Normal operation wakes once per hour at the node's slot start (FR-004,
    ;; FR-011), computed from NODE_ADDRESS/SLOT_SCHEDULE/GROUPED_START_S -
    ;; see slot_schedule.h. WAKE_UP_MINUTE/WAKE_UP_SECOND are obsolete; setting
    ;; either one fails the build (see leaf_node.cc).
    ;; For testing, wake once per minute at SAMPLE_SECOND instead. If
    ;; STANDBY_MODE=1, the node will wake up, sample, and go back to sleep. If 
    ;; SAMPLE_ONCE_PER_MINUTE=1, the node will wake up, sample, once every minute.
    -D SAMPLE_ONCE_PER_MINUTE=0
    -D SAMPLE_SECOND=30

;; pio check's cppcheck invocation doesn't pass -Iinclude, so it can't resolve
;; leaf_node_logic.h and misses that these functions (defined in
;; src/leaf_node_logic.cc) are called from leaf_node.cc/get_battery_voltage.cc -
;; a false unusedFunction positive, not dead code (TASK-001).
check_flags =
    cppcheck: --suppress=unusedFunction:*/leaf_node_logic.cc
    ;; old - cppcheck: --suppress=unusedFunction:*/slot_schedule.cc

lib_deps_builtin =
    Wire
    SPI
   
lib_deps_external = 
    soil_sensor_common
    greiman/SdFat@^2.1.2
    mikem/RadioHead@^1.120
    adafruit/Adafruit BusIO@^1.10.1
    adafruit/Adafruit SHT31 Library@^2.0.0
    arduino-libraries/RTCZero@^1.6.0
    paulstoffregen/SerialFlash

; RTCZero
;SerialFlash

;; These are in 'lib' 
;;   SdFat, Adafruit_BusIO, Adafruit_SHT31, RadioHead, Soil_Sensor_Common

; Serial Monitor options
upload_speed = 115200
monitor_speed = 115200

[env:native]
platform = native
build_flags =
    -Wall -Wextra

;; This PlatformIO version's list_test_names() requires test suite directory
;; names to start with "test_" (not just match test_filter) or it silently
;; falls back to building the whole test/ tree as one suite named "*" and
;; finds nothing under test_build_src's src filter - confirmed empirically,
;; not documented anywhere upstream (see node-time-slots-plan.md).
test_filter = test_native_*
lib_ldf_mode = deep
test_build_src = yes
;; Only Arduino-free src/ files build under native - leaf_node.cc, blink.cc,
;; and get_battery_voltage.cc include Arduino.h, which doesn't exist here
;; (TASK-001). Add a new entry here whenever a new Arduino-dependent file is
;; added to src/, or env:native will fail to compile the moment it reaches it.
build_src_filter = +<*> -<leaf_node.cc> -<blink.cc> -<get_battery_voltage.cc>
;; old - build_src_filter = -<*> +<slot_schedule.cc>

[env:debugZeroUSB]
platform = atmelsam
board = zeroUSB
framework = arduino

build_type = debug
;; debug_build_flags = -O0 -ggdb3 -g3
;; the above line causes: .../.platformio/packages/framework-arduino-samd/
;;   cores/arduino/HardwareSerial.h:67: 
;;   undefined reference to `vtable for HardwareSerial'    
debug_init_break = tbreak loop
debug_tool = jlink
upload_protocol = jlink

;; Build options
build_flags =
    ${common_env_data.build_flags}

;; Dependencies
lib_deps =
    ${common_env_data.lib_deps_builtin}
    ${common_env_data.lib_deps_external}

check_flags =
    ${common_env_data.check_flags}

[env:zeroUSB]
platform = atmelsam
board = zeroUSB
framework = arduino

;; Build options
build_flags =
    ${common_env_data.build_flags}

;; Dependencies
lib_deps =
    ${common_env_data.lib_deps_builtin}
    ${common_env_data.lib_deps_external}

check_flags =
    ${common_env_data.check_flags}
